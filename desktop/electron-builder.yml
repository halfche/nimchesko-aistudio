appId: com.nimchesko.aistudio
productName: nimchesko-ai-studio
executableName: nimchesko-ai-studio
copyright: Copyright © 2026 nimchesko
asar: true

directories:
  output: ../release
  buildResources: build

files:
  - main.cjs
  - preload.cjs
  - package.json
  - from: ../dist
    to: dist
    filter:
      - "**/*"
      - "!*.zip"

linux:
  icon: build/icon.png
  category: Development;Utility;
  vendor: nimchesko
  maintainer: nimchesko <nimchesko@gmail.com>
  synopsis: nimchesko AI studio - Local AI workspace for all local models
  description: Cross-platform local AI studio, multi-model comparison workbench, and Ollama/GGUF workspace.
  desktop:
    entry:
      Name: nimchesko AI studio
      StartupWMClass: nimchesko-ai-studio
  artifactName: nimchesko-ai-studio-${version}-${arch}.${ext}
  # Build only the unpacked directory by default; desktop/scripts/build-linux.sh
  # packages AppImage, .deb, .rpm, .tar, .tar.zst, and .pkg.tar.zst sequentially
  # from isolated staging copies so targets never collide on release/linux-unpacked.
  target:
    - target: dir
      arch: [x64]

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1

rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libXtst
    - xdg-utils
    - at-spi2-core
    - libuuid

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  artifactName: nimchesko-ai-studio-${version}-win-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: nimchesko AI studio

portable:
  artifactName: nimchesko-ai-studio-${version}-win-${arch}-portable.${ext}

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  identity: null
  extendInfo:
    CFBundleDisplayName: nimchesko AI studio
    CFBundleName: nimchesko AI studio
  artifactName: nimchesko-ai-studio-${version}-mac-${arch}.${ext}
  target:
    - target: pkg
      arch: [universal]

pkg:
  allowAnywhere: true
  allowCurrentUserHome: true
  allowRootDirectory: true
